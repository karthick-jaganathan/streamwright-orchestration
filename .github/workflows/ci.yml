name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install streamwright-orchestration
        run: python -m pip install -e .

      - name: Run tests (a stand-in streamwright CLI; no connectors needed)
        run: python -m unittest discover -s tests

      - name: Validate the Dagster definitions
        run: dagster definitions validate -m streamwright.orchestration.definitions
